name: Juntar noticias

on:
  schedule:
    - cron: "7,37 * * * *"     # cada 30 minutos
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["news-config.json", "scripts/fetch-news.mjs", ".github/workflows/noticias.yml"]

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar noticias
        run: node scripts/fetch-news.mjs /tmp/datos/news.json
      - name: Publicar en la rama "datos"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/datos
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -qm "Noticias $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
