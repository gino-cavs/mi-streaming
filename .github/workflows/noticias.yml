name: Juntar noticias, guía de TV, automovilismo y boxeo

on:
  schedule:
    - cron: "7,37 * * * *"     # cada 30 minutos
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["news-config.json", "scripts/**", ".github/workflows/noticias.yml"]

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar noticias
        run: node scripts/fetch-news.mjs /tmp/datos/news.json
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
      - name: Efemérides fortineras (Wikipedia + Wikidata, una vez por mes)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-efemerides.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Estadios de Fulbito (ESPN + Wikidata, una vez por mes)
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/fetch-estadios.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Álbum del día (Wikidata + YouTube, una vez por día)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-album.mjs /tmp/datos "$GITHUB_REPOSITORY"
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: MG News (Monte Grande y Esteban Echeverría)
        continue-on-error: true
        timeout-minutes: 4
        run: node scripts/fetch-mg.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Feeds de tus canales de YouTube (gratis, para ahorrar cuota)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-ytfeeds.mjs /tmp/datos
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
      - name: Temas de 420 time (3 por día, eclécticos)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-temas420.mjs /tmp/datos "$GITHUB_REPOSITORY"
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
      - name: Novelas argentinas (playlists oficiales, una vez por mes)
        continue-on-error: true
        timeout-minutes: 4
        run: node scripts/fetch-novelas.mjs /tmp/datos "$GITHUB_REPOSITORY"
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
      - name: Grilla desde tu calendario (link iCal guardado en FUNVS)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/fetch-grillacal.mjs /tmp/datos
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
      - name: Grilla de radios (webs de cada radio, una vez por mes)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-radios.mjs /tmp/datos "$GITHUB_REPOSITORY"
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TV de aire (El Trece y TV Pública, desde sus webs, una vez por día)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/fetch-tvcanales.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Grilla de canales de streaming (laguiadelstreaming.com, una vez por día)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/fetch-guia.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Actualidad (los temas que cubren todos los medios)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-actualidad.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Guía de TV (canales de cada partido, futbolenvivoargentina.com)
        continue-on-error: true
        run: node scripts/fetch-tv.mjs /tmp/datos
      - name: Automovilismo (F1, MotoGP, NASCAR, TC, TC2000, Top Race)
        continue-on-error: true
        run: node scripts/fetch-motor.mjs /tmp/datos
      - name: Boxeo de Primera (TyC Sports)
        continue-on-error: true
        run: node scripts/fetch-boxeo.mjs /tmp/datos
      - name: Datos para Juegos (Wikidata, una vez por semana)
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/fetch-juegos.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Resúmenes automáticos (YouTube, con la clave guardada en FUNVS)
        continue-on-error: true
        timeout-minutes: 4
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-resumenes.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Mundo Clásicos (Wikipedia, Wikidata y ESPN)
        continue-on-error: true
        timeout-minutes: 15
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-clasicos.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Datos para "¿Jugó con?" (Wikidata, una vez por semana)
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/fetch-jugo.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Publicar en la rama "datos"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/datos
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Noticias $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
