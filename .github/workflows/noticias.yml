name: Juntar noticias, guía de TV, automovilismo y boxeo

on:
  schedule:
    - cron: "7,37 * * * *"     # cada 30 minutos
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["news-config.json", "scripts/**", ".github/workflows/noticias.yml"]

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar noticias
        run: node scripts/fetch-news.mjs /tmp/datos/news.json
        env:
          GIST_ID: ${{ vars.GIST_ID }}
      - name: Guía de TV (canales de cada partido, futbolenvivoargentina.com)
        continue-on-error: true
        run: node scripts/fetch-tv.mjs /tmp/datos
      - name: Automovilismo (F1, MotoGP, NASCAR, TC, TC2000, Top Race)
        continue-on-error: true
        run: node scripts/fetch-motor.mjs /tmp/datos
      - name: Boxeo de Primera (TyC Sports)
        continue-on-error: true
        run: node scripts/fetch-boxeo.mjs /tmp/datos
      - name: Datos para Juegos (Wikidata, una vez por semana)
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/fetch-juegos.mjs /tmp/datos "$GITHUB_REPOSITORY"
      - name: Publicar en la rama "datos"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/datos
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Noticias $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
