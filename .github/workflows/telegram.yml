name: telegram
# Avisos de FUNVS por Telegram. Cada ~10 minutos; durante partidos de tus equipos revisa cada 45 segundos.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: telegram
  cancel-in-progress: false
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Recuperar estado (qué ya se avisó)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/tg-state.json
          key: tg-state-${{ github.run_id }}
          restore-keys: tg-state-
      - name: Revisar y avisar
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: node scripts/alertas.mjs /tmp/tg-state.json "$GITHUB_REPOSITORY"
      - name: Guardar estado
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/tg-state.json
          key: tg-state-${{ github.run_id }}
