name: probe-openf1
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== ventana"; curl -s --compressed "https://api.openf1.org/v1/car_data?session_key=11412&driver_number=43&date>=2026-11-08T17%3A09%3A33.345Z&date<=2026-11-08T17%3A11%3A02.128Z" | grep -o '"date"' | wc -l
          sleep 1; echo "=== ubicación"; curl -s --compressed "https://api.openf1.org/v1/location?session_key=11412&driver_number=43&date>=2026-11-08T17%3A09%3A33.345Z&date<=2026-11-08T17%3A11%3A02.128Z" | grep -o '"x"' | wc -l
          sleep 1; echo "=== meetings"; curl -s --compressed "https://api.openf1.org/v1/meetings?year=2026" | head -c 300; echo
