name: probe
on: { push: { paths: ['scripts/probe-res.mjs'] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && node scripts/probe-res.mjs > out/res.txt 2>&1 || true
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          YT_KEY: ${{ secrets.YT_KEY }}
      - run: |
          cd out && git init -q && git checkout -q -b probe && git add -A
          git -c user.name=funvs -c user.email=funvs@users.noreply.github.com commit -qm "probe ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
