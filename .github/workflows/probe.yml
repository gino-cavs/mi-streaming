name: probe
on: { push: { paths: ['scripts/fetch-album.mjs', '.github/workflows/probe.yml'] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p out
          TEST=1 node scripts/fetch-album.mjs out > out/log.txt 2>&1 || true
          node scripts/fetch-album.mjs out x/none >> out/log.txt 2>&1 || true
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cd out && git init -q && git checkout -q -b probe && git add -A
          git -c user.name=funvs -c user.email=funvs@users.noreply.github.com commit -qm "probe ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
