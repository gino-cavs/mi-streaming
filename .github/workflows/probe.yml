name: probe
on: { push: { paths: ['scripts/fetch-tvcanales.mjs', '.github/workflows/probe.yml'] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p out; FORCE=1 node scripts/fetch-tvcanales.mjs out x/none > out/log.txt 2>&1 || true
          curl -s -A "Mozilla/5.0 (compatible; FUNVS-tv/1.0)" https://www.elnueve.com.ar/horarios -o out/elnueve.html || true
      - run: |
          cd out && git init -q && git checkout -q -b probe && git add -A
          git -c user.name=funvs -c user.email=funvs@users.noreply.github.com commit -qm "probe ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
