name: probe-openf1
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s "https://en.wikipedia.org/w/index.php?title=List_of_association_football_club_rivalries_in_the_Americas&action=raw" | grep -n -i -A12 "=\s*Argentina" | head -40
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261108-20261129" | head -c 300; echo
      - run: node scripts/fetch-clasicos.mjs /tmp/x "$GITHUB_REPOSITORY"
      - run: |
          cat > /tmp/i.cjs <<'JS'
          const j = require('/tmp/x/clasicos.json'); const by = {};
          j.derbies.forEach(d => by[d.pais] = (by[d.pais] || 0) + 1); console.log(JSON.stringify(by));
          console.log(j.fixtures.slice(0, 15).map(f => f.date.slice(0, 16) + ' ' + f.h + ' vs ' + f.a + ' (' + f.lg + ') ' + f.st).join('\n'));
          for (const k of ['Boca', 'Celtic', 'Liverpool', 'Inter', 'Flamengo', 'Peñarol', 'Ajax', 'Olympiacos', 'Marseille'])
            { const d = j.derbies.find(x => (x.a.n + ' ' + x.b.n).includes(k)); console.log(k, '=>', d ? `${d.n} | ${d.es || ''} | ${d.a.n} vs ${d.b.n} | ESPN ${d.a.espn}/${d.b.espn} | ${d.nboth} | ${JSON.stringify(d.info).slice(0, 200)}` : 'NO'); }
          JS
          node /tmp/i.cjs
