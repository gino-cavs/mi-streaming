name: probe
on: { push: { paths: ['scripts/probe-telered.mjs'] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-telered.mjs || true
      - run: |
          cd out && git init -q && git checkout -q -b probe && git add -A
          git -c user.name=funvs -c user.email=funvs@users.noreply.github.com commit -qm "probe ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
