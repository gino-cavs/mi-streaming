name: probe-openf1
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/o && cd /tmp/o
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          {
          curl -s -L -A "$UA" https://hagovusqueda.com/ -o /tmp/h.html; echo "=== hv target"; grep -o '"target"[^}]\{0,160\}' /tmp/h.html | head -3
          curl -s -L -A "$UA" https://laguiadelstreaming.com/ -o /tmp/g.html
          echo "=== links"; grep -o 'href="/[a-z0-9-]*"' /tmp/g.html | sort -u | head -40
          python3 - <<'PY'
          import re
          s=open('/tmp/g.html',encoding='utf8',errors='ignore').read().replace('\\"','"')
          for k in ['"start_time"','"startTime"','"hora_inicio"','"start"']:
            for m in list(re.finditer(k, s))[:2]: print('KEY',k, s[max(0,m.start()-400):m.start()+500].replace('\n',' ')); print('-----')
          i=s.find('Vorterix'); print('VORT', s[i-600:i+900].replace('\n',' '))
          PY
          } > out.txt 2>&1
          git init -q && git checkout -q -b probe && git add out.txt && git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
