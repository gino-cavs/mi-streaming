name: probe-openf1
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          g(){ echo "=== $1"; curl -s --compressed -A "FUNVS/1.0" "https://api.openf1.org/v1/$1" | head -c ${2:-500}; echo; sleep 1; }
          g "sessions?session_key=latest" 500
          g "session_result?session_key=latest" 700
          g "drivers?session_key=latest&driver_number=43" 500
          g "stints?session_key=latest&driver_number=43" 400
          g "pit?session_key=latest" 400
          g "position?session_key=latest&driver_number=43" 250
          g "laps?session_key=latest&driver_number=43&lap_number=5" 600
          g "car_data?session_key=latest&driver_number=43&speed>=330" 300
          g "location?session_key=latest&driver_number=43" 250
