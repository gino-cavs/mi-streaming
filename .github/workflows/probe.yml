name: probe-openf1
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fetch-clasicos.mjs /tmp/x "$GITHUB_REPOSITORY"
        env:
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
      - run: |
          ls -la /tmp/x; node -e "const j=require('/tmp/x/clasicos.json');const by={};j.derbies.forEach(d=>by[d.pais]=(by[d.pais]||0)+1);console.log(JSON.stringify(by));console.log(j.fixtures.slice(0,12).map(f=>f.date.slice(0,10)+' '+f.h+' vs '+f.a+' ('+f.lg+')').join('\n'));for(const k of ["Celtic","Peñarol","Cerro","Urawa","Sydney","Athletic Club"]){const d=j.derbies.find(x=>(x.a.n+x.b.n).includes(k));console.log(k,"=>",d?JSON.stringify(d).slice(0,500):"NO")}"
