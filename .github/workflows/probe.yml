name: probe-openf1
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          echo "=== robots"; curl -s -A "$UA" https://www.mitelefe.com/robots.txt | head -40
          curl -s -L -A "$UA" https://www.mitelefe.com/los-simuladores/temporada-1 -o /tmp/t1.html; echo "=== t1 size $(wc -c < /tmp/t1.html)"
          echo "=== links"; grep -o 'href="[^"]*simuladores[^"]*"' /tmp/t1.html | sort -u | head -40
          echo "=== video hints"; grep -o -i 'youtube[^"]\{0,80\}\|m3u8[^"]\{0,80\}\|"videoId"[^,]\{0,40\}\|jwplayer[^"]\{0,40\}\|iframe[^>]\{0,120\}\|embed[^"]\{0,80\}\|__NEXT_DATA__\|mediastream[^"]\{0,80\}' /tmp/t1.html | sort | uniq -c | sort -rn | head -30
          EP=$(grep -o 'href="[^"]*simuladores[^"]*"' /tmp/t1.html | grep -v temporada | head -1 | sed 's/href="//;s/"//'); echo "=== ep $EP"
          [ -n "$EP" ] && curl -s -L -A "$UA" "https://www.mitelefe.com${EP#https://www.mitelefe.com}" -o /tmp/ep.html && echo "ep size $(wc -c < /tmp/ep.html)" && grep -o -i 'youtube[^"]\{0,80\}\|m3u8[^"]\{0,100\}\|"videoId"[^,]\{0,40\}\|iframe[^>]\{0,160\}\|mdstrm[^"]\{0,100\}\|mediastream[^"]\{0,100\}\|player[^"]\{0,60\}\|x-frame[^\n]\{0,40\}' /tmp/ep.html | sort | uniq -c | sort -rn | head -30
          [ -n "$EP" ] && curl -s -I -L -A "$UA" "https://www.mitelefe.com${EP#https://www.mitelefe.com}" | grep -i "x-frame\|content-security\|HTTP/"
          echo "=== tvmaze"; curl -s "https://api.tvmaze.com/shows/83" | head -c 200; echo; curl -s "https://api.tvmaze.com/shows/83/episodes" | grep -o '"season":[0-9]*' | sort | uniq -c | tail -5
