name: probe-openf1
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for S in laguiadelstreaming.com hagovusqueda.com; do
            echo "=== $S robots"; curl -s -L -A "$UA" https://$S/robots.txt | head -40
            curl -s -L -A "$UA" https://$S/ -o /tmp/h.html; echo "=== $S home $(wc -c < /tmp/h.html) bytes"
            grep -o -i '<title>[^<]*\|__NEXT_DATA__\|/api/[a-zA-Z0-9_/?=&.-]\{0,60\}\|supabase[^"]\{0,60\}\|firebase[^"]\{0,40\}\|\.json[^"]\{0,30\}\|action="[^"]*"\|name="q"\|[?&]q=[^"&]\{0,20\}\|search[?/][^"]\{0,40\}' /tmp/h.html | sort | uniq -c | sort -rn | head -20
          done
