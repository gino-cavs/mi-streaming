# Arma la app de Android / Fire Stick y la publica en "Releases" como FUNVS.apk
name: App Android
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Compilar
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Publicar en Releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FUNVS.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "FUNVS para Android y Fire Stick" --notes "Instalá FUNVS.apk en el celu o en el Fire Stick (con Downloader)." --latest
          gh release upload app FUNVS.apk --clobber
      - name: Registro de la compilación
        if: always()
        run: |
          mkdir -p /tmp/o && cp build.log /tmp/o/ 2>/dev/null || echo "sin log" > /tmp/o/build.log
          ls -la android/app/build/outputs/apk/release/ >> /tmp/o/build.log 2>&1 || true
          cd /tmp/o && git init -q && git checkout -q -b apk-log && git add -A
          git -c user.name=funvs -c user.email=funvs@users.noreply.github.com commit -qm "log ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-log
